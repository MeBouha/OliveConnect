version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: oliveconnect-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: oliveconnect
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - oliveconnect
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: oliveconnect-backend:local
    container_name: oliveconnect-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/oliveconnect
      JWT_SECRET: oliveconnect-local-development-secret-change-in-production
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - oliveconnect
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    image: oliveconnect-frontend:local
    container_name: oliveconnect-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - oliveconnect
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: oliveconnect-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - oliveconnect

volumes:
  mongo-data:

networks:
  oliveconnect:
    driver: bridge
